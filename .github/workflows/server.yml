name: Ubuntu Desktop Server

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install rclone
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash
          rclone version

      - name: Install cloudflared
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb
          cloudflared --version

      - name: Configure Google Drive
        env:
          RCLONE_CONFIG_GDRIVE_TYPE: drive
          RCLONE_CONFIG_GDRIVE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          RCLONE_CONFIG_GDRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          RCLONE_CONFIG_GDRIVE_SCOPE: drive.file
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: |
          test -n "$RCLONE_CONFIG_GDRIVE_CLIENT_ID"
          test -n "$RCLONE_CONFIG_GDRIVE_CLIENT_SECRET"
          test -n "$GOOGLE_REFRESH_TOKEN"

          export RCLONE_CONFIG_GDRIVE_TOKEN="$(python3 -c 'import json,os; print(json.dumps({"access_token":"","token_type":"Bearer","refresh_token":os.environ["GOOGLE_REFRESH_TOKEN"],"expiry":"2000-01-01T00:00:00Z"}))')"

          echo "Google Drive credentials loaded."

          rclone config redacted gdrive

          rclone lsd gdrive:

      - name: Restore persistent data
        env:
          RCLONE_CONFIG_GDRIVE_TYPE: drive
          RCLONE_CONFIG_GDRIVE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          RCLONE_CONFIG_GDRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          RCLONE_CONFIG_GDRIVE_SCOPE: drive.file
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: |
          set -e

          test -n "$GOOGLE_REFRESH_TOKEN"

          export RCLONE_CONFIG_GDRIVE_TOKEN="$(python3 -c 'import json,os; print(json.dumps({"access_token":"","token_type":"Bearer","refresh_token":os.environ["GOOGLE_REFRESH_TOKEN"],"expiry":"2000-01-01T00:00:00Z"}))')"

          mkdir -p "$GITHUB_WORKSPACE/server-data"

          echo "Checking Google Drive..."

          rclone mkdir gdrive:server-data

          echo "Files currently stored in Google Drive:"
          rclone lsf gdrive:server-data || true

          echo "Restoring persistent data..."

          rclone copy \
            gdrive:server-data \
            "$GITHUB_WORKSPACE/server-data" \
            --progress \
            --transfers 4 \
            --checkers 8

          echo "Files restored locally:"
          find "$GITHUB_WORKSPACE/server-data" -type f -print || true

          echo "Persistent data restored."

      - name: Build Ubuntu image
        run: |
          docker build \
            --platform linux/amd64 \
            --progress=plain \
            --no-cache \
            -t ubuntu-desktop-server .

      - name: Start Ubuntu desktop
        env:
        
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
          
        run: |
          docker run -d \
            --name ubuntu-desktop-server \
            -e VNC_PASSWORD="$VNC_PASSWORD" \
            -p 5901:5901 \
            -p 6080:6080 \
            -p 2053:2053 \
            -p 2096:2096 \
            -p 17432:17432 \
            -p 23187:23187 \
            -p 28641:28641 \
            -p 31472:31472 \
            -p 39756:39756 \
            -p 45283:45283 \
            -v "$GITHUB_WORKSPACE/server-data:/root/server-data" \
            ubuntu-desktop-server

          sleep 10

          docker ps
          docker logs ubuntu-desktop-server

      - name: Start Cloudflare Quick Tunnels
        env:
          WORKER_ADAPTER_URL: ${{ secrets.WORKER_ADAPTER_URL }}
          WORKER_REGISTER_TOKEN: ${{ secrets.WORKER_REGISTER_TOKEN }}
        run: |
          set -e

          test -n "$WORKER_ADAPTER_URL"
          test -n "$WORKER_REGISTER_TOKEN"

          WORKER_ADAPTER_URL="${WORKER_ADAPTER_URL%/}"

          mkdir -p /tmp/cloudflared

          start_tunnel() {
            local NAME="$1"
            local PORT="$2"

            echo ""
            echo "=========================================="
            echo "STARTING TUNNEL: $NAME"
            echo "LOCAL PORT: $PORT"
            echo "=========================================="

            nohup cloudflared tunnel \
              --no-autoupdate \
              --url "http://127.0.0.1:${PORT}" \
              > "/tmp/cloudflared/${NAME}.log" 2>&1 &

            local PID=$!

            echo "$PID" > "/tmp/cloudflared/${NAME}.pid"

            local URL=""

            for i in {1..30}; do
              URL=$(grep -o 'https://[-a-zA-Z0-9]*\.trycloudflare\.com' \
                "/tmp/cloudflared/${NAME}.log" | head -n 1 || true)

              if [ -n "$URL" ]; then
                break
              fi

              sleep 2
            done

            if [ -z "$URL" ]; then
              echo "Tunnel URL was not found for $NAME."
              echo ""
              echo "Cloudflared log:"
              cat "/tmp/cloudflared/${NAME}.log"
              exit 1
            fi

            echo "$URL" > "/tmp/cloudflared/${NAME}.url"

            echo ""
            echo "Tunnel ready:"
            echo "$URL"
          }

          start_tunnel "vnc" "6080"
          start_tunnel "panel" "2053"
          start_tunnel "service-2096" "2096"
          start_tunnel "xray" "17432"
          start_tunnel "service-23187" "23187"
          start_tunnel "service-28641" "28641"
          start_tunnel "service-31472" "31472"
          start_tunnel "service-39756" "39756"
          start_tunnel "service-45283" "45283"

          VNC_URL=$(cat /tmp/cloudflared/vnc.url)
          PANEL_URL=$(cat /tmp/cloudflared/panel.url)
          SERVICE_2096_URL=$(cat /tmp/cloudflared/service-2096.url)
          XRAY_URL=$(cat /tmp/cloudflared/xray.url)
          SERVICE_23187_URL=$(cat /tmp/cloudflared/service-23187.url)
          SERVICE_28641_URL=$(cat /tmp/cloudflared/service-28641.url)
          SERVICE_31472_URL=$(cat /tmp/cloudflared/service-31472.url)
          SERVICE_39756_URL=$(cat /tmp/cloudflared/service-39756.url)
          SERVICE_45283_URL=$(cat /tmp/cloudflared/service-45283.url)

          echo "VNC_URL=$VNC_URL" >> "$GITHUB_ENV"
          echo "PANEL_URL=$PANEL_URL" >> "$GITHUB_ENV"
          echo "SERVICE_2096_URL=$SERVICE_2096_URL" >> "$GITHUB_ENV"
          echo "XRAY_URL=$XRAY_URL" >> "$GITHUB_ENV"
          echo "SERVICE_23187_URL=$SERVICE_23187_URL" >> "$GITHUB_ENV"
          echo "SERVICE_28641_URL=$SERVICE_28641_URL" >> "$GITHUB_ENV"
          echo "SERVICE_31472_URL=$SERVICE_31472_URL" >> "$GITHUB_ENV"
          echo "SERVICE_39756_URL=$SERVICE_39756_URL" >> "$GITHUB_ENV"
          echo "SERVICE_45283_URL=$SERVICE_45283_URL" >> "$GITHUB_ENV"

          echo ""
          echo "=========================================="
          echo "ALL QUICK TUNNELS ARE READY"
          echo "=========================================="
          echo "VNC:         $VNC_URL"
          echo "PANEL:       $PANEL_URL"
          echo "PORT 2096:   $SERVICE_2096_URL"
          echo "XRAY:        $XRAY_URL"
          echo "PORT 23187:  $SERVICE_23187_URL"
          echo "PORT 28641:  $SERVICE_28641_URL"
          echo "PORT 31472:  $SERVICE_31472_URL"
          echo "PORT 39756:  $SERVICE_39756_URL"
          echo "PORT 45283:  $SERVICE_45283_URL"
          echo "=========================================="

      - name: Register Quick Tunnels with Worker Adapter
        env:
          WORKER_ADAPTER_URL: ${{ secrets.WORKER_ADAPTER_URL }}
          WORKER_REGISTER_TOKEN: ${{ secrets.WORKER_REGISTER_TOKEN }}
        run: |
          set -e

          test -n "$WORKER_ADAPTER_URL"
          test -n "$WORKER_REGISTER_TOKEN"

          WORKER_ADAPTER_URL="${WORKER_ADAPTER_URL%/}"

          register_route() {
            local ROUTE="$1"
            local TUNNEL="$2"

            echo ""
            echo "Registering route: $ROUTE"
            echo "Tunnel: $TUNNEL"

            RESPONSE=$(curl \
              --fail-with-body \
              --silent \
              --show-error \
              --request POST \
              --url "${WORKER_ADAPTER_URL}/_adapter/register" \
              --header "Authorization: Bearer ${WORKER_REGISTER_TOKEN}" \
              --header "Content-Type: application/json" \
              --data "{\"route\":\"${ROUTE}\",\"tunnel\":\"${TUNNEL}\"}")

            echo "$RESPONSE"
          }

          register_route "/" "$VNC_URL"
          register_route "/panel" "$PANEL_URL"
          register_route "/p2096" "$SERVICE_2096_URL"
          register_route "/xray" "$XRAY_URL"
          register_route "/p23187" "$SERVICE_23187_URL"
          register_route "/p28641" "$SERVICE_28641_URL"
          register_route "/p31472" "$SERVICE_31472_URL"
          register_route "/p39756" "$SERVICE_39756_URL"
          register_route "/p45283" "$SERVICE_45283_URL"

          echo ""
          echo "=========================================="
          echo "ALL ROUTES REGISTERED"
          echo "=========================================="
          echo ""
          echo "Worker Adapter:"
          echo "$WORKER_ADAPTER_URL"
          echo ""
          echo "VNC:"
          echo "$WORKER_ADAPTER_URL/"
          echo ""
          echo "Panel:"
          echo "$WORKER_ADAPTER_URL/panel/"
          echo ""
          echo "Port 2096:"
          echo "$WORKER_ADAPTER_URL/p2096/"
          echo ""
          echo "Xray:"
          echo "$WORKER_ADAPTER_URL/xray/"
          echo ""
          echo "Port 23187:"
          echo "$WORKER_ADAPTER_URL/p23187/"
          echo ""
          echo "Port 28641:"
          echo "$WORKER_ADAPTER_URL/p28641/"
          echo ""
          echo "Port 31472:"
          echo "$WORKER_ADAPTER_URL/p31472/"
          echo ""
          echo "Port 39756:"
          echo "$WORKER_ADAPTER_URL/p39756/"
          echo ""
          echo "Port 45283:"
          echo "$WORKER_ADAPTER_URL/p45283/"
          echo ""
          echo "=========================================="

      - name: Keep server alive
        env:
          RCLONE_CONFIG_GDRIVE_TYPE: drive
          RCLONE_CONFIG_GDRIVE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          RCLONE_CONFIG_GDRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          RCLONE_CONFIG_GDRIVE_SCOPE: drive.file
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: |
          set -e

          export RCLONE_CONFIG_GDRIVE_TOKEN="$(python3 -c 'import json,os; print(json.dumps({"access_token":"","token_type":"Bearer","refresh_token":os.environ["GOOGLE_REFRESH_TOKEN"],"expiry":"2000-01-01T00:00:00Z"}))')"

          sync_to_drive() {
            echo ""
            echo "=========================================="
            echo "SYNCING SERVER DATA TO GOOGLE DRIVE"
            echo "=========================================="

            CONTAINER_RUNNING=false

            if docker ps --format '{{.Names}}' | grep -q '^ubuntu-desktop-server$'; then
              CONTAINER_RUNNING=true
              echo "Pausing Ubuntu container for consistent backup..."
              docker pause ubuntu-desktop-server
            fi

            sudo chmod -R a+rX "$GITHUB_WORKSPACE/server-data"

            rclone mkdir gdrive:server-data

            set +e

            rclone sync \
              "$GITHUB_WORKSPACE/server-data" \
              gdrive:server-data \
              --transfers 4 \
              --checkers 8 \
              --create-empty-src-dirs

            SYNC_STATUS=$?

            set -e

            if [ "$CONTAINER_RUNNING" = true ]; then
              echo "Resuming Ubuntu container..."
              docker unpause ubuntu-desktop-server
            fi

            if [ "$SYNC_STATUS" -ne 0 ]; then
              echo "Google Drive sync failed."
              return "$SYNC_STATUS"
            fi

            echo "Sync completed."
          }

          cleanup() {
            echo ""
            echo "Stopping server..."

            docker stop ubuntu-desktop-server || true

            echo "Final sync to Google Drive..."

            sync_to_drive

            echo "Persistent data saved."
          }

          trap cleanup EXIT INT TERM

          echo "Server is running."
          echo "Automatic Google Drive sync: every 30 seconds."

          START_TIME=$(date +%s)
          MAX_RUNTIME=$((345 * 60))

          while true; do
            if ! docker ps --format '{{.Names}}' | grep -q '^ubuntu-desktop-server$'; then
              echo "Ubuntu container stopped."
              docker ps -a
              docker logs ubuntu-desktop-server || true
              exit 1
            fi

            sleep 30

            sync_to_drive

            ELAPSED=$(( $(date +%s) - START_TIME ))

            if [ "$ELAPSED" -ge "$MAX_RUNTIME" ]; then
              echo "5 hours 45 minutes reached."
              break
            fi
          done

      - name: Start next workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          echo "Starting next Ubuntu Desktop Server workflow..."

          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --request POST \
            --url "https://api.github.com/repos/${{ github.repository }}/actions/workflows/server.yml/dispatches" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --header "Content-Type: application/json" \
            --data '{"ref":"main"}'

          echo "Next workflow dispatched successfully."
